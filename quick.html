<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rychlý zápis — Vtipníci</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zápis">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dceefb">
<link rel="manifest" href="manifest-quick.json" id="manifestLink">
<script>
  // Kdyz je stranka otevrena jako quick.html?termin=1 (druha ikona na
  // plose pro rezim "Termin na zitra"), musi se pouzit JINY manifest -
  // ten s vlastnim start_url vcetne "?termin=1". Android totiz pri
  // "Pridat na plochu" pouziva pro spusteni z ikony start_url z manifestu
  // MISTO skutecne adresy, ze ktere se zastupce vytvaril - bez tohohle
  // prepnuti by obe ikony (bezny Quick i Termin) vzdy skoncily na stejnem
  // (spolecnem) start_url a rezim Termin by se tak z plochy nikdy
  // nespustil. Musi byt inline a co nejdriv v <head>, aby to platilo uz
  // ve chvili, kdy prohlizec zjistuje, jestli je stranka "instalovatelna".
  if (new URLSearchParams(location.search).get("termin") === "1") {
    document.getElementById("manifestLink").href = "manifest-quick-termin.json";
  }
</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-quick.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16-quick.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%93%8C%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #dceefb;
    --paper: #ffffff;
    --ink: #2b2620;
    --ink-soft: #6b6155;
    --line: #e3e9ef;
    --accent: #3d6fa8;
    --accent-dark: #2c527f;
    --accent-soft: #e5eefa;
    --shadow: 0 1px 3px rgba(43,38,32,0.06), 0 4px 16px rgba(43,38,32,0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100%;
  }
  input, select, textarea, button { font-family: inherit; }

  .card {
    background: var(--paper);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; text-align: center; }
  p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; text-align: center; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-soft); }
  .field-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .field-label-row label { margin-bottom: 0; }
  .mic-btn {
    background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--accent-dark);
    border-radius: 8px; padding: 4px 9px; font-size: 14px; cursor: pointer; line-height: 1.4;
  }
  .mic-btn.recording { background: #f6cdc6; border-color: #b3261e; color: #b3261e; }
  .mic-interim {
    font-size: 13px; font-style: italic; color: var(--ink-soft);
    min-height: 16px; margin-top: 4px; padding: 0 2px;
  }
  .mic-status {
    font-size: 11px; color: #a89f92; min-height: 14px; margin-top: 2px; padding: 0 2px;
  }
  .field-required {
    background: var(--accent-soft); border: 1.5px solid var(--accent);
    border-radius: 12px; padding: 10px 12px 12px;
  }
  .field-required label { color: var(--accent-dark); }
  .field-required label::after { content: " *"; color: var(--accent); }
  input[type=email], input[type=password], input[type=date], input[type=text], input[type=url], select, textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    font-size: 16px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 110px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff; border: none; padding: 14px 20px;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 4px;
  }
  .btn:active { background: var(--accent-dark); transform: scale(0.98); }

  .link-row { text-align: center; margin-top: 16px; }
  .link-row a { color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  .link-row a:hover { color: var(--accent-dark); }

  #loginError { color: #b3261e; font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 10px;
    font-size: 14.5px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  #entryScreen { display: none; }
  @media (max-width: 700px) {
    body.keyboard-active #entryScreen h1,
    body.keyboard-active #entryScreen p.sub { display: none; }
    /* Skutecna pricina, proc se predtim neslo doscrollovat zpet na Datum a
       Druh: body je flex kontejner s "align-items: center", ktery pri
       otevrene klavesnici zmensi viditelnou vysku, a pokud pak obsah karty
       presahuje tuto vysku, centrovani ho posune tak, ze horni cast (Datum,
       Druh) skonci NAD viditelnou oblasti - mimo dosah scrollovani (scroll
       nejde do zaporna). Reseni: dokud je nejake pole aktivni, kartu misto
       stredu zarovnat k hornimu okraji, aby pripadny prebytek obsahu
       prepadal dolu (kam se da normalne doscrollovat), ne nahoru.  */
    body.keyboard-active {
      align-items: flex-start;
      justify-content: flex-start;
    }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="loginScreen">
  <h1>📓 Rychlý zápis</h1>
  <p class="sub">Přihlaš se jednou, appka si tě pak pamatuje</p>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPassword">Heslo</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Přihlásit se</button>
    <div id="loginError"></div>
  </form>
</div>

<!-- QUICK ENTRY -->
<div class="card" id="entryScreen">
  <h1>📓 Rychlý zápis</h1>
  <p class="sub">Zadej poznámku a ulož jedním klepnutím</p>
  <form id="entryForm">
    <div class="row2">
      <div class="field">
        <label for="datum">Datum</label>
        <input type="date" id="datum" required>
      </div>
      <div class="field">
        <label for="druh">Druh</label>
        <select id="druh" required></select>
      </div>
    </div>
    <div class="field field-required">
      <label for="nazev">Název</label>
      <input type="text" id="nazev" required placeholder="Název poznámky" autofocus>
    </div>
    <div class="field">
      <label for="termin">Termín (nepovinné)</label>
      <input type="date" id="termin">
    </div>
    <div class="field">
      <label for="stitky">Štítky</label>
      <input type="text" id="stitky" placeholder="oddělené čárkou, např. výlet, vtip">
    </div>
    <div class="field">
      <div class="field-label-row">
        <label for="popis">Popis (nepovinné)</label>
        <button type="button" id="micBtn" class="mic-btn" title="Diktovat hlasem" aria-label="Diktovat hlasem">🎙️</button>
      </div>
      <textarea id="popis" placeholder="Napiš, co se stalo…"></textarea>
      <div class="mic-interim" id="micInterim" aria-live="polite"></div>
      <div class="mic-status" id="micStatus"></div>
    </div>
    <button type="submit" class="btn">Uložit záznam</button>
  </form>
  <div class="link-row">
    <a href="index.html">Otevřít celou aplikaci →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, addDoc, query, where, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeOsvSECUhxjCQ7y2fFv3ybkxw2vsHwEo",
    authDomain: "vtipnici.firebaseapp.com",
    projectId: "vtipnici",
    storageBucket: "vtipnici.firebasestorage.app",
    messagingSenderId: "803980056829",
    appId: "1:803980056829:web:1358b51db8b3e706e50694"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });

  const NOTES_COL = "poznamky";
  const FOLDERS_COL = "slozky";
  const FALLBACK_DRUHY = ["Hláška", "Kino", "Kniha", "Kultura", "Myšlenka", "Lékaři", "Tipy"];
  const loginScreen = document.getElementById("loginScreen");
  const entryScreen = document.getElementById("entryScreen");
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const entryForm = document.getElementById("entryForm");

  // Na mobilu po zaklepnuti do pole vyskoci klavesnice a ubere hodne mista.
  // Dokud je nejake pole ve formulari aktivni, appka schova uvodni nadpis a
  // podnadpis (jen ty), at se na obrazovku vejde vic poli najednou. Datum a
  // Druh se nikdy neschovavaji - jen mohou (u pole Popis, ktere je niz ve
  // formulari) docasne vyjet mimo obrazovku, ale jdou dostat zpet scrollem.
  let keyboardHideTimer = null;
  function setKeyboardActive(active) {
    document.body.classList.toggle("keyboard-active", active);
  }
  const datumEl = document.getElementById("datum");
  const druhEl = document.getElementById("druh");
  const nazevEl = document.getElementById("nazev");
  const popisEl = document.getElementById("popis");
  const stitkyEl = document.getElementById("stitky");
  const terminEl = document.getElementById("termin");
  const micBtn = document.getElementById("micBtn");
  const micInterim = document.getElementById("micInterim");
  const micStatus = document.getElementById("micStatus");
  const toast = document.getElementById("toast");

  let currentUid = null;
  let unsubFolders = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("visible");
    setTimeout(() => toast.classList.remove("visible"), 2000);
  }

  // new Date().toISOString() je v UTC, ne v místním čase - kolem půlnoci by
  // appka "myslela", že je ještě včera. Tohle vrátí dnešní datum podle
  // místního času.
  function localTodayStr() {
    const d = new Date();
    const tzOffsetMs = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tzOffsetMs).toISOString().slice(0, 10);
  }

  // Rezim "Termin na zitra": otevre se pres quick.html?termin=1 (druha ikona
  // na plose vedle bezneho Quick). Datum, Druh a Nazev se chovaji uplne
  // stejne jako v bezicim Quick - meni se jen predvyplneni pole Termin,
  // kam se rovnou da kurzor a automaticky start diktovani do Popisu.
  const terminMode = new URLSearchParams(location.search).get("termin") === "1";

  function localTomorrowStr() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const tzOffsetMs = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tzOffsetMs).toISOString().slice(0, 10);
  }

  // ---------- Auto-vyplnění Název z Popis ----------
  // Dokud je pole Název prázdné, odvodí se z první věty (do tečky/vykřičníku/
  // otazníku/odřádkování) nebo z prvních 50 znaků Popisu. Jakmile si uživatel
  // Název sám vyplní, automatické doplňování se pro danou poznámku přestane
  // uplatňovat (dokud pole zase nesmaže).
  function deriveTitleFromText(text) {
    const trimmed = text.trim();
    if (!trimmed) return "";
    const stopIdx = trimmed.search(/[.!?\n]/);
    let candidate = stopIdx === -1 ? trimmed : trimmed.slice(0, stopIdx);
    candidate = candidate.trim();
    if (candidate.length > 50) candidate = candidate.slice(0, 50).trim();
    return candidate;
  }

  popisEl.addEventListener("input", () => {
    if (!nazevEl.value.trim()) {
      nazevEl.value = deriveTitleFromText(popisEl.value);
    }
  });

  // ---------- Diktování hlasem do Popisu ----------
  // Základ je přesně ta verze, která na uživatelčině telefonu (Samsung)
  // prokazatelně spolehlivě fungovala už 13. 8. Klíčové vlastnosti, které
  // NEMĚNIT bez otestování na reálném zařízení:
  //  - JEDNA instance SpeechRecognition vytvořená jednou při načtení
  //    stránky (ne nová při každém startu/restartu)
  //  - do POLE (popisEl.value) se vždy jen PŘIDÁ nový FINÁLNÍ úsek
  //    (e.resultIndex), nikdy se nepřepisuje/neskládá celá session odznova
  //  - žádný automatický restart po odmlce - "end" jen uklidí tlačítko,
  //    pro pokračování je potřeba klepnout na mikrofon znovu
  //
  // Živé zobrazování textu za mluvení (interimResults: true) je zpátky, ale
  // NEjde do samotného pole poznámky - běžící (ještě nehotový, nepřesný)
  // odhad appka ukazuje jen v odděleném řádku pod textarea (#micInterim).
  // Do pole se pořád zapisuje výhradně finální, hotový text stejným
  // ověřeným mechanismem jako předtím - takže i kdyby živý odhad chvíli
  // "blbnul" (u průběžných odhadů je to normální, opravují se za pochodu),
  // do uložené poznámky se to nikdy nedostane.
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  function setInterimPreview(text) {
    if (micInterim) micInterim.textContent = text || "";
  }

  // DOČASNÁ DIAGNOSTIKA - appka se teď na dálku nedá odladit hádáním, tak
  // radši malý viditelný "deník" toho, co rozpoznávání skutečně dělá kolo
  // po kole (nastartovalo? zachytilo zvuk? poznalo řeč? přišel vůbec nějaký
  // "result"? jaká přesná chybová hláška?). Zobrazuje se přímo pod polem
  // Popis, takže to jde přečíst i na telefonu bez připojení k počítači.
  function setStatus(text) {
    if (micStatus) micStatus.textContent = text;
  }

  if (SpeechRecognitionCtor && micBtn) {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "cs-CZ";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.addEventListener("start", () => {
      setStatus("① Rozpoznávání nastartovalo…");
    });

    recognition.addEventListener("audiostart", () => {
      setStatus("② Mikrofon zachytává zvuk…");
    });

    recognition.addEventListener("speechstart", () => {
      setStatus("③ Slyším řeč…");
    });

    recognition.addEventListener("speechend", () => {
      setStatus("④ Řeč skončila, zpracovávám…");
    });

    recognition.addEventListener("result", (e) => {
      let finalChunk = "";
      let interimChunk = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalChunk += chunk;
        else interimChunk += chunk;
      }
      finalChunk = finalChunk.trim();
      interimChunk = interimChunk.trim();
      if (finalChunk) {
        const sep = popisEl.value.trim() ? " " : "";
        popisEl.value = popisEl.value.trim() + sep + finalChunk;
        popisEl.dispatchEvent(new Event("input"));
        setStatus("⑤ Zapsáno: „" + finalChunk + "“");
      } else if (interimChunk) {
        setStatus("⑤ Průběžně slyším: „" + interimChunk + "“");
      }
      setInterimPreview(interimChunk);
    });

    recognition.addEventListener("end", () => {
      isRecording = false;
      micBtn.classList.remove("recording");
      setInterimPreview("");
      setStatus((s => s ? s + " · Ukončeno" : "Ukončeno")(micStatus ? micStatus.textContent : ""));
    });

    recognition.addEventListener("error", (e) => {
      isRecording = false;
      micBtn.classList.remove("recording");
      setInterimPreview("");
      setStatus("❌ Chyba: " + e.error);
      if (e.error !== "no-speech" && e.error !== "aborted") {
        showToast("Diktování selhalo (" + e.error + ")");
      }
    });

    micBtn.addEventListener("click", () => {
      if (isRecording) {
        recognition.stop();
        return;
      }
      isRecording = true;
      micBtn.classList.add("recording");
      setInterimPreview("");
      setStatus("Startuji…");
      try {
        recognition.start();
      } catch (err) {
        isRecording = false;
        micBtn.classList.remove("recording");
        setStatus("❌ Start selhal: " + err.message);
      }
    });
  } else if (micBtn) {
    // Web Speech API tu není podporovaná (typicky desktopový Firefox) -
    // tlačítko radši schovat, než aby jen nefungovalo.
    micBtn.style.display = "none";
  }

  function resetDate() {
    datumEl.value = localTodayStr();
  }

  await setPersistence(auth, browserLocalPersistence).catch(() => {});

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUid = user.uid;
      loginScreen.style.display = "none";
      entryScreen.style.display = "block";
      resetDate();
      subscribeFolders(user.uid);
      if (terminMode) {
        terminEl.value = localTomorrowStr();
        setTimeout(() => {
          popisEl.focus();
          if (SpeechRecognitionCtor && micBtn && micBtn.style.display !== "none") {
            micBtn.click();
          }
        }, 200);
      } else {
        setTimeout(() => nazevEl.focus(), 200);
      }
    } else {
      currentUid = null;
      loginScreen.style.display = "block";
      entryScreen.style.display = "none";
      if (unsubFolders) { unsubFolders(); unsubFolders = null; }
    }
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.textContent = "";
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = "Nesprávný e-mail nebo heslo.";
    }
  });

  function subscribeFolders(uid) {
    const q = query(collection(db, FOLDERS_COL), where("uid", "==", uid));
    let firstLoad = true;
    unsubFolders = onSnapshot(q, (snapshot) => {
      let names;
      if (snapshot.empty) {
        names = FALLBACK_DRUHY;
      } else {
        names = snapshot.docs.map(d => d.data()).map(f => f.nazev);
      }
      names = [...names].sort((a, b) => a.localeCompare(b, "cs"));
      const prevValue = druhEl.value;
      druhEl.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (firstLoad && names.length) {
        druhEl.value = names[names.length - 1];
      } else if (names.includes(prevValue)) {
        druhEl.value = prevValue;
      }
      firstLoad = false;
    });
  }

  entryForm.querySelectorAll("input, select, textarea").forEach(field => {
    field.addEventListener("focus", () => {
      clearTimeout(keyboardHideTimer);
      setKeyboardActive(true);
    });
    field.addEventListener("blur", () => {
      keyboardHideTimer = setTimeout(() => {
        const active = document.activeElement;
        if (!active || !entryForm.contains(active)) {
          setKeyboardActive(false);
        }
      }, 50);
    });
  });

  entryForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const datum = datumEl.value;
    const druh = druhEl.value;
    const nazev = nazevEl.value.trim();
    const popis = popisEl.value.trim();
    const stitky = stitkyEl.value
      .split(",")
      .map(t => t.trim().replace(/^#/, ""))
      .filter(Boolean);
    if (!datum || !druh || !nazev) return;

    const termin = terminEl.value;

    try {
      await addDoc(collection(db, NOTES_COL), {
        datum, druh, popis, nazev, stitky, termin,
        oblibene: false,
        uid: currentUid,
        vytvoreno: serverTimestamp(),
        upraveno: serverTimestamp()
      });
      nazevEl.value = "";
      popisEl.value = "";
      stitkyEl.value = "";
      terminEl.value = "";
      resetDate();
      nazevEl.focus();
      showToast("Uloženo ✓");
    } catch (err) {
      showToast("Chyba: " + err.message);
    }
  });
</script>
</body>
</html>
